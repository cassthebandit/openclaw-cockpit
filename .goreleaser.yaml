version: 2

project_name: openclaw-cockpit

changelog:
  disable: true

builds:
  - id: openclaw-cockpit
    main: ./cmd/openclaw-cockpit
    binary: openclaw-cockpit
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64

archives:
  - ids:
      - openclaw-cockpit
    files:
      - LICENSE*
      - README.md
      - helpers/**/*.py
      - helpers/README.md
      - examples/**/*
      - docs/lifecycle-contract.md
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
