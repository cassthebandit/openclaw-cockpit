name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          files="$(gofumpt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      # The live tmux tests t.Skip when tmux is absent, so a green test job
      # would not prove the AC4/AC5 live semantics actually ran. Fail here
      # instead of skipping silently.
      - name: Require tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Test
        run: go test ./...

      - name: Launcher regression
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Race test
        run: go test -race ./...

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Every advertised release target from .goreleaser.yaml must compile.
      # Cross-build proves compilation only, not native runtime behavior.
      - name: Cross-build advertised targets
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./cmd/openclaw-cockpit
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          # Disable output caps so repeated findings cannot hide later sites.
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0
